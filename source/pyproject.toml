[project]
name = "hermes-browser-tests"
version = "0.0.0"
description = "Isolated tests for the Hermes browser installer"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pytest==9.1.1",
    "PyYAML==6.0.3",
    "psutil==7.2.2",
]

[project.optional-dependencies]
plugin = ["httpx==0.28.1", "websockets==15.0.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/scripts/install", "tests/test_browser_test_isolation.py"]
markers = [
    "linux_only: exercises Linux-specific behaviour; skipped on other hosts",
    "macos_only: exercises macOS-specific behaviour; skipped on other hosts",
    "windows_only: exercises native-Windows behaviour; skipped on other hosts",
    "live_system_guard_bypass: legacy marker; does not bypass browser-test isolation",
]
